<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOMA — вход</title><style>
:root{--ink:#191312;--muted:#746965;--a:#ff5f8f;--b:#ff9364;--c:#7b61ff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);
background:radial-gradient(circle at 10% 0%,rgba(255,95,143,.12),transparent 28%),radial-gradient(circle at 90% 10%,rgba(123,97,255,.10),transparent 30%),#fff9f7}
a{text-decoration:none;color:inherit}.wrap{width:min(1080px,calc(100% - 32px));margin:auto}.top{height:72px;display:flex;align-items:center;justify-content:space-between}.logo{font:900 30px Georgia,serif}
.box{max-width:620px;margin:7vh auto;background:rgba(255,255,255,.92);border:1px solid rgba(25,19,18,.09);border-radius:30px;padding:34px;box-shadow:0 24px 70px rgba(25,19,18,.12)}
.ey{display:inline-block;padding:8px 12px;border-radius:999px;background:#fff;border:1px solid rgba(255,95,143,.18);font-size:11px;font-weight:900;letter-spacing:.13em;color:#933d5d}
h1,h2,h3{font-family:Georgia,serif}h1{font-size:clamp(46px,8vw,80px);line-height:.92;letter-spacing:-.045em;margin:18px 0}p{color:var(--muted);line-height:1.6}
input{width:100%;height:56px;border:1px solid rgba(25,19,18,.15);border-radius:16px;padding:0 16px;font-size:16px;margin:10px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;min-height:56px;border:0;border-radius:999px;color:#fff;font-weight:900;background:linear-gradient(120deg,var(--a),var(--b),var(--c));box-shadow:0 14px 32px rgba(255,95,143,.28);cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0 80px}.card{background:#fff;border:1px solid rgba(25,19,18,.09);border-radius:25px;padding:24px;min-height:240px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 16px 42px rgba(25,19,18,.08)}.card h3{font-size:30px;margin:8px 0}.tag{font-size:11px;font-weight:900;letter-spacing:.12em;color:#9b4260}.open{display:inline-flex;justify-content:center;padding:13px 17px;border-radius:999px;background:#191312;color:#fff;font-weight:900}.locked{opacity:.45}
@media(max-width:760px){.grid{grid-template-columns:1fr}.box{padding:24px;margin-top:3vh}}
</style></head><body>
<div class="wrap"><div class="top"><a class="logo" href="index.html">SOMA</a><a href="index.html">← На главную</a></div>
<div class="box"><div class="ey">ЗАКРЫТАЯ ЗОНА</div><h1>ВХОД<br>В SOMA.</h1><p>Введи почту, на которую Софа открыла доступ. Получишь одноразовую ссылку для входа — пароль не нужен.</p>
<input id="email" type="email" placeholder="Твоя почта"><button class="btn" id="send">Получить ссылку</button><p id="msg"></p>
<p style="font-size:13px">Нет доступа? Напиши Софе в Telegram @sofcombank.</p></div></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import {SUPABASE_URL,SUPABASE_ANON_KEY} from './supabase-config.js';
const s=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
document.getElementById('send').onclick=async()=>{
 const email=document.getElementById('email').value.trim(), msg=document.getElementById('msg');
 if(!email){msg.textContent='Введи почту.';return}
 msg.textContent='Проверяю доступ…';
 const {data:allowed,error:checkError}=await s.rpc('is_preapproved_email',{p_email:email});
 if(checkError || !allowed){
   msg.textContent='Эта почта пока не имеет доступа. Напиши Софе в Telegram @sofcombank.';
   return;
 }
 const redirectTo=new URL('dashboard.html',location.href).toString();
 const {error}=await s.auth.signInWithOtp({email,options:{emailRedirectTo:redirectTo,shouldCreateUser:true}});
 msg.textContent=error?'Не удалось отправить ссылку. Попробуй ещё раз.':'Готово 💗 Проверь почту — ссылка для входа отправлена.';
};
</script></body></html>
